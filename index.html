<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMTech.ai &mdash; What if AI had infinite memory?</title>
    <meta name="description" content="High performance processors for AI, everywhere. What if AI had infinite memory?">
    <link rel="icon" type="image/svg+xml" href="/images/Big Logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            color: #e8ecf4;
            overflow: hidden;
            position: relative;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(56, 132, 255, 0.18), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(120, 80, 220, 0.15), transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(0, 200, 200, 0.08), transparent 60%),
                #0a0e1a;
            z-index: -2;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
            z-index: -1;
            pointer-events: none;
        }

        .glow-1 {
            width: 45vw;
            height: 45vw;
            left: 8%;
            top: 12%;
            background: radial-gradient(circle, rgba(56, 132, 255, 0.28), transparent 70%);
            animation: drift-1 24s ease-in-out infinite;
        }

        .glow-2 {
            width: 40vw;
            height: 40vw;
            right: 5%;
            bottom: 10%;
            background: radial-gradient(circle, rgba(120, 80, 220, 0.24), transparent 70%);
            animation: drift-2 30s ease-in-out infinite;
        }

        @keyframes drift-1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(6vw, 4vh); }
        }

        @keyframes drift-2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-5vw, -5vh); }
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            width: clamp(5rem, 12vw, 8rem);
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 24px rgba(56, 132, 255, 0.35));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2.5rem;
        }

        .tagline {
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            color: #c7d4ee;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            color: #6a7796;
            letter-spacing: 0.05em;
        }

        footer a {
            color: #a5b8e0;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <main>
        <img class="logo" src="/images/Big Logo.svg" alt="CIMTech logo">
        <h1>CIMTech</h1>
        <p class="tagline">What if AI had infinite memory?</p>
    </main>

    <footer>
        &copy; 2026 CIMTech, Inc. &middot; <a href="mailto:james.read@cimtech.ai">james.read@cimtech.ai</a>
    </footer>
</body>
</html>
