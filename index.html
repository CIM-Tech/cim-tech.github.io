<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMTech.ai &mdash; Coming Soon</title>
    <meta name="description" content="High performance processors for AI, everywhere. Coming soon.">
    <link rel="icon" type="image/svg+xml" href="/images/Big Logo.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            color: #e8ecf4;
            overflow: hidden;
            position: relative;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(56, 132, 255, 0.18), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(120, 80, 220, 0.15), transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(0, 200, 200, 0.08), transparent 60%),
                #0a0e1a;
            z-index: -2;
        }

        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            z-index: -1;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .logo {
            width: clamp(5rem, 12vw, 8rem);
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 0 24px rgba(56, 132, 255, 0.35));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #a5b8e0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: clamp(1rem, 2vw, 1.35rem);
            color: #a5b8e0;
            font-weight: 300;
            letter-spacing: 0.02em;
            margin-bottom: 3rem;
            max-width: 36rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.4rem;
            background: rgba(56, 132, 255, 0.1);
            border: 1px solid rgba(56, 132, 255, 0.3);
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            color: #c7d4ee;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.85rem;
            color: #6a7796;
            letter-spacing: 0.05em;
        }

        footer a {
            color: #a5b8e0;
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="grid"></div>

    <main>
        <img class="logo" src="/images/Big Logo.svg" alt="CIMTech logo">
        <h1>CIMTech</h1>
        <p class="tagline">High performance processors for AI, everywhere.</p>
        <div class="badge">
            <span class="pulse"></span>
            <span>Coming Soon</span>
        </div>
    </main>

    <footer>
        &copy; 2026 CIMTech, Inc. &middot; <a href="mailto:james.read@cimtech.ai">james.read@cimtech.ai</a>
    </footer>
</body>
</html>
